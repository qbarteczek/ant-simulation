name: Deploy web build to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pygbag
        run: pip install pygbag

      - name: Build web (WebAssembly) version
        # ume_block=0: gra nie używa dźwięku, więc pomijamy ekran "kliknij aby
        # zacząć" wymagany domyślnie przez politykę autoplay audio przeglądarek
        # (inaczej plansza wygląda na pustą/zawieszoną do czasu kliknięcia)
        run: python -m pygbag --build --ume_block 0 .

      - name: Mark output as non-Jekyll
        run: touch build/web/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - id: deployment
        uses: actions/deploy-pages@v4
